name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Test against BayesForge `dev` (the tests use features not yet on PyPI,
      # e.g. m.data(DataFrame), observed-site helpers): install it in a plain
      # Python and point PythonCall at it instead of letting CondaPkg resolve
      # the published bayesforge. Users still get the CondaPkg.toml setup.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BayesForge (dev)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bayesforge[cpu] @ https://github.com/BGN-for-ASNA/BF/archive/refs/heads/dev.zip"
          echo "JULIA_CONDAPKG_BACKEND=Null" >> "$GITHUB_ENV"
          echo "JULIA_PYTHONCALL_EXE=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
