# Python side of PyBayesForge, resolved by CondaPkg on first use.
# Versions of jax / numpyro / arviz are constrained by bayesforge itself
# (pip resolves them from its requirements), so only bayesforge is pinned here.
[deps]
python = ">=3.12,<3.15"

[pip.deps]
ipython = ""
bayesforge = { version = ">=0.0.59", extras = ["cpu"] }
